<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Administrador · Link IA</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="box" id="login">
  <h2 style="font-size:24px">Acceso de administrador</h2><p class="sub" style="margin-bottom:20px">Entra para ver cotizaciones y administrar el muro.</p>
  <form id="lf"><label for="le">Correo</label><input id="le" type="email" required>
  <label for="lp">Contraseña</label><input id="lp" type="password" required>
  <p class="msg" id="lmsg" style="color:#FF8A8A;margin-bottom:10px"></p>
  <button class="btn btn-acc" type="submit" style="width:100%">Entrar</button></form>
  <p style="margin-top:16px"><a href="index.html" class="msg">← Volver a la página</a></p>
</div>

<div class="wrap hidden" id="panel">
  <nav><a class="logo" href="index.html">Link <b>IA</b> · Admin</a>
  <div class="actions"><a class="btn btn-line" href="index.html">Ver página</a><button class="btn btn-line" id="out">Salir</button></div></nav>
  <div class="tabs"><button class="on" data-t="tc">Cotizaciones</button><button data-t="tm">Muro</button></div>

  <div id="tc"></div>

  <div id="tm" class="hidden">
    <form class="form" id="pf" style="margin-bottom:24px">
      <div class="full"><label for="pt">Texto de la publicación</label><textarea id="pt" rows="4" placeholder="¿Qué quieres compartir?"></textarea></div>
      <div><label for="pi">Imagen (opcional)</label><input id="pi" type="file" accept="image/*"></div>
      <div style="align-self:end"><button class="btn btn-acc" type="submit">Publicar</button> <span class="msg" id="pmsg"></span></div>
    </form>
    <div id="plist"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="admin.js"></script>
</body></html>
